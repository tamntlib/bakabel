name: Publish GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0)'
        type: string
        required: true
        default: v0.2.0
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: bakabel-ghcr-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\nimage=%s\n' "$VERSION" "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test linux/amd64 image
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .
          docker run --rm --network none "$IMAGE:$VERSION" version
          docker run --rm --network none --entrypoint /usr/bin/restic "$IMAGE:$VERSION" version

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          printf 'Published `%s` (`%s`, `sha-%s`)\n' "$DIGEST" "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
