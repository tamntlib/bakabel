name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Go unit tests (-race) and go vet
        run: |
          set -euo pipefail
          MOD_VOL="bakabel-mod-$$"
          extractor=$(docker create restic/restic:0.18.1 version)
          cleanup() {
            docker rm "$extractor" >/dev/null 2>&1 || true
            docker volume rm "$MOD_VOL" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$extractor:/usr/bin/restic" "$RUNNER_TEMP/restic"
          docker volume create "$MOD_VOL" >/dev/null
          docker run --rm \
            -e GOTOOLCHAIN=local \
            -v "$PWD:/work:ro" -w /work -v "$MOD_VOL:/go/pkg/mod" \
            golang:1.26.10-bookworm \
            sh -eu -c 'go mod download && go mod verify'
          docker run --rm --network none \
            -e GOTOOLCHAIN=local -e GOAMD64=v1 -e RESTIC_BIN=/usr/bin/restic \
            -v "$RUNNER_TEMP/restic:/usr/bin/restic:ro" \
            -v "$MOD_VOL:/go/pkg/mod:ro" \
            -v "$PWD:/work:ro" -w /work \
            golang:1.26.10-bookworm \
            sh -eu -c 'go test -race -count=1 -v ./... && go vet ./...'

      - name: Build image and run end-to-end Postgres + Volume backup/restore test
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg VERSION=ci -t bakabel:ci .
          docker run --rm --network none bakabel:ci version
          docker run --rm --network none --entrypoint /usr/bin/restic bakabel:ci version

          # End-to-end live integration test: Compose-labeled Postgres + Volume -> auto-init -> backup -> restore
          NET="bakabel-ci-net-$$"
          SRC_VOL="bakabel-ci-src-$$"
          DST_VOL="bakabel-ci-dst-$$"
          REPO_VOL="bakabel-ci-repo-$$"
          STATE_VOL="bakabel-ci-state-$$"
          PG_SRC="bakabel-ci-pg-src-$$"
          PG_DST="bakabel-ci-pg-dst-$$"
          VOL_CTR="bakabel-ci-vol-ctr-$$"
          BAK_CTR="bakabel-ci-runner-$$"
          cleanup() {
            docker rm -f "$BAK_CTR" "$PG_SRC" "$PG_DST" "$VOL_CTR" >/dev/null 2>&1 || true
            docker volume rm "$SRC_VOL" "$DST_VOL" "$REPO_VOL" "$STATE_VOL" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET" >/dev/null
          docker volume create "$SRC_VOL" >/dev/null
          docker volume create "$DST_VOL" >/dev/null
          docker volume create "$REPO_VOL" >/dev/null
          docker volume create "$STATE_VOL" >/dev/null

          # Start labeled Postgres source and empty restore target
          docker run -d --name "$PG_SRC" --network "$NET" \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=appdb \
            -l com.docker.compose.project=ciapp -l com.docker.compose.service=db \
            -l bakabel.type=postgres \
            postgres:18.6-alpine3.24 >/dev/null
          docker run -d --name "$PG_DST" --network "$NET" \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=appdb \
            postgres:18.6-alpine3.24 >/dev/null

          # Start labeled volume source with test files
          docker run -d --name "$VOL_CTR" --network "$NET" \
            -v "$SRC_VOL:/data" \
            -l com.docker.compose.project=ciapp -l com.docker.compose.service=files \
            -l bakabel.type=volume -l bakabel.paths=/data \
            alpine:3.21 sh -c 'mkdir -p /data/sub && printf "hello-bakabel\n" > /data/sub/note.txt && sleep 300' >/dev/null

          # Wait for Postgres containers to be ready
          for ctr in "$PG_SRC" "$PG_DST"; do
            for i in $(seq 1 30); do
              if docker exec "$ctr" pg_isready -U app -d appdb >/dev/null 2>&1; then break; fi
              sleep 1
            done
          done
          docker exec "$PG_SRC" psql -U app -d appdb -c "CREATE TABLE items (id INT PRIMARY KEY, name TEXT); INSERT INTO items VALUES (1, 'alpha'), (2, 'beta');"

          # Start Bakabel container (100% env vars, zero manual restic init!)
          docker run -d --name "$BAK_CTR" --network "$NET" \
            -e BAKABEL_REPOSITORY=/repository \
            -e RESTIC_PASSWORD=ci-secret-password \
            -e BAKABEL_SCOPE=ciapp \
            -e BAKABEL_SCHEDULE="0 2 * * *" \
            -v "$STATE_VOL:/var/lib/bakabel" \
            -v "$REPO_VOL:/repository" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            bakabel:ci serve >/dev/null

          echo "=== plan ==="
          docker exec "$BAK_CTR" bakabel plan
          echo "=== run (with auto-init) ==="
          docker exec "$BAK_CTR" bakabel run
          echo "=== health ==="
          docker exec "$BAK_CTR" bakabel health
          echo "=== snapshots ==="
          SNAPS=$(docker exec "$BAK_CTR" bakabel snapshots)
          echo "$SNAPS"

          PG_SNAP=$(printf '%s' "$SNAPS" | python3 -c 'import json,sys; print([s["id"] for s in json.load(sys.stdin) if "type:postgres" in s["tags"]][0])')
          VOL_SNAP=$(printf '%s' "$SNAPS" | python3 -c 'import json,sys; print([s["id"] for s in json.load(sys.stdin) if "type:volume" in s["tags"]][0])')

          echo "=== restore postgres ==="
          docker exec "$BAK_CTR" bakabel restore "$PG_SNAP" --container "$PG_DST"
          ROWS=$(docker exec "$PG_DST" psql -At -U app -d appdb -c "SELECT count(*) FROM items;")
          test "$ROWS" = "2"

          echo "=== restore volume ==="
          docker exec "$BAK_CTR" bakabel restore "$VOL_SNAP" --volume "$DST_VOL"
          CONTENT=$(docker run --rm -v "$DST_VOL:/check:ro" alpine:3.21 cat /check/sub/note.txt)
          test "$CONTENT" = "hello-bakabel"
          echo "End-to-end Compose + Local CI test PASSED!"

      - name: End-to-end Docker Swarm + S3 (VersityGW) backup, retention, and restore test
        run: |
          set -euo pipefail
          docker swarm init --advertise-addr 127.0.0.1 >/dev/null
          NODE_ID=$(docker info --format '{{.Swarm.NodeID}}')
          S3_NET="bakabel-s3-net"
          S3_CTR="bakabel-ci-s3"
          S3_VOL="bakabel-ci-s3-data"
          PG_DST="bakabel-swarm-pg-dst"
          VOL_DST="bakabel-swarm-vol-dst"
          WORK=$(mktemp -d)
          cleanup() {
            docker stack rm backup testapp >/dev/null 2>&1 || true
            docker rm -f "$S3_CTR" "$PG_DST" >/dev/null 2>&1 || true
            for i in $(seq 1 20); do
              if [ -z "$(docker ps -aq --filter label=com.docker.stack.namespace=backup)" ] && \
                 [ -z "$(docker ps -aq --filter label=com.docker.stack.namespace=testapp)" ]; then break; fi
              sleep 1
            done
            docker volume rm "$S3_VOL" "$VOL_DST" testapp_pgdata testapp_filesdata backup_bakabel-state >/dev/null 2>&1 || true
            docker network rm "$S3_NET" >/dev/null 2>&1 || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          # Create attachable overlay network and VersityGW S3 backend with bucket "backups"
          docker network create --driver overlay --attachable "$S3_NET" >/dev/null
          docker volume create "$S3_VOL" >/dev/null
          docker run --rm -v "$S3_VOL:/data" alpine:3.21 mkdir -p /data/backups
          docker run -d --name "$S3_CTR" --network "$S3_NET" --network-alias s3 \
            -e ROOT_ACCESS_KEY=bakabeltest -e ROOT_SECRET_KEY=bakabelsecret \
            -v "$S3_VOL:/data" \
            ghcr.io/versity/versitygw:v1.11.0 --port :7070 posix /data >/dev/null

          # Wait for VersityGW S3 endpoint to accept connections
          S3_READY=0
          for i in $(seq 1 30); do
            if docker run --rm --network "$S3_NET" alpine:3.21 nc -z s3 7070 >/dev/null 2>&1; then
              S3_READY=1
              break
            fi
            sleep 1
          done
          test "$S3_READY" = "1"

          # Deploy application Swarm stack with deploy.labels (bakabel.type=postgres & volume)
          cat > "$WORK/testapp.yaml" <<EOF
          services:
            db:
              image: postgres:18.6-alpine3.24
              environment:
                POSTGRES_USER: app
                POSTGRES_PASSWORD: swarmpw
                POSTGRES_DB: appdb
              volumes:
                - pgdata:/var/lib/postgresql
              deploy:
                replicas: 1
                placement:
                  constraints:
                    - node.id == ${NODE_ID}
                labels:
                  bakabel.type: postgres
            files:
              image: alpine:3.21
              command: ["sh", "-c", "mkdir -p /data/nested && printf 'swarm-s3-ok\n' > /data/nested/file.txt && sleep 600"]
              volumes:
                - filesdata:/data
              deploy:
                replicas: 1
                placement:
                  constraints:
                    - node.id == ${NODE_ID}
                labels:
                  bakabel.type: volume
                  bakabel.paths: /data
          volumes:
            pgdata:
            filesdata:
          EOF
          docker stack deploy --resolve-image never -c "$WORK/testapp.yaml" testapp >/dev/null

          # Deploy independent backup Swarm stack (100% env vars, S3 backend, auto-init, retention).
          # Attach both default (non-attachable Swarm overlay) and s3net (attachable) to prove
          # Bakabel's volume helper skips non-attachable overlays and picks s3net.
          cat > "$WORK/backup.yaml" <<EOF
          services:
            bakabel:
              image: bakabel:ci
              environment:
                BAKABEL_REPOSITORY: s3:http://s3:7070/backups/swarm-repo
                BAKABEL_SCHEDULE: "0 2 * * *"
                BAKABEL_TZ: Asia/Ho_Chi_Minh
                BAKABEL_SCOPE: testapp
                BAKABEL_RETENTION: "last=1"
                RESTIC_PASSWORD: swarm-s3-passphrase
                AWS_ACCESS_KEY_ID: bakabeltest
                AWS_SECRET_ACCESS_KEY: bakabelsecret
                AWS_DEFAULT_REGION: us-east-1
              volumes:
                - bakabel-state:/var/lib/bakabel
                - /var/run/docker.sock:/var/run/docker.sock:ro
              networks:
                - default
                - s3net
              deploy:
                replicas: 1
                placement:
                  constraints:
                    - node.role == manager
                    - node.id == ${NODE_ID}
          volumes:
            bakabel-state:
          networks:
            default:
            s3net:
              external: true
              name: ${S3_NET}
          EOF
          docker stack deploy --resolve-image never -c "$WORK/backup.yaml" backup >/dev/null

          # Wait for Swarm task containers
          wait_task_ctr() {
            for i in $(seq 1 45); do
              cid=$(docker ps -q --filter "label=com.docker.swarm.service.name=$1" | head -n 1)
              if [ -n "$cid" ]; then echo "$cid"; return 0; fi
              sleep 1
            done
            return 1
          }
          PG_SRC_CTR=$(wait_task_ctr testapp_db)
          FILES_CTR=$(wait_task_ctr testapp_files)
          BAK_CTR=$(wait_task_ctr backup_bakabel)

          for i in $(seq 1 30); do
            if docker exec "$PG_SRC_CTR" pg_isready -U app -d appdb >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for i in $(seq 1 15); do
            if docker exec "$FILES_CTR" test -f /data/nested/file.txt >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$PG_SRC_CTR" psql -U app -d appdb -c \
            "CREATE TABLE records (id INT PRIMARY KEY, body TEXT); INSERT INTO records SELECT g, 'row-' || g FROM generate_series(1, 1000) g;"

          echo "=== Swarm plan ==="
          PLAN=$(docker exec "$BAK_CTR" bakabel plan)
          echo "$PLAN"
          printf '%s' "$PLAN" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["platform"]=="swarm" and len(d["targets"])==2, d'

          echo "=== Swarm + S3 run #1 (auto-init S3 repo + backup + retention) ==="
          docker exec "$BAK_CTR" bakabel run
          echo "=== Swarm + S3 run #2 (verify retention keeps 1 per target) ==="
          docker exec "$BAK_CTR" bakabel run

          # Verify source DB stayed online with 0 restarts
          RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$PG_SRC_CTR")
          test "$RESTARTS" = "0"

          echo "=== Swarm health & snapshots ==="
          docker exec "$BAK_CTR" bakabel health
          SNAPS=$(docker exec "$BAK_CTR" bakabel snapshots)
          echo "$SNAPS"
          printf '%s' "$SNAPS" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert len(s)==2, f"expected 2 snapshots after last=1 retention, got {len(s)}"'

          PG_SNAP=$(printf '%s' "$SNAPS" | python3 -c 'import json,sys; print([s["id"] for s in json.load(sys.stdin) if "type:postgres" in s["tags"]][0])')
          VOL_SNAP=$(printf '%s' "$SNAPS" | python3 -c 'import json,sys; print([s["id"] for s in json.load(sys.stdin) if "type:volume" in s["tags"]][0])')

          echo "=== Restore Swarm Postgres snapshot from S3 into fresh DB ==="
          docker run -d --name "$PG_DST" -e POSTGRES_USER=app -e POSTGRES_PASSWORD=swarmpw -e POSTGRES_DB=appdb postgres:18.6-alpine3.24 >/dev/null
          for i in $(seq 1 30); do
            if docker exec "$PG_DST" pg_isready -U app -d appdb >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$BAK_CTR" bakabel restore "$PG_SNAP" --container "$PG_DST"
          COUNT=$(docker exec "$PG_DST" psql -At -U app -d appdb -c "SELECT count(*) FROM records;")
          echo "Restored Swarm Postgres rows: $COUNT"
          test "$COUNT" = "1000"

          echo "=== Restore Swarm Volume snapshot from S3 into fresh volume ==="
          docker volume create "$VOL_DST" >/dev/null
          docker exec "$BAK_CTR" bakabel restore "$VOL_SNAP" --volume "$VOL_DST"
          CONTENT=$(docker run --rm -v "$VOL_DST:/check:ro" alpine:3.21 cat /check/nested/file.txt)
          echo "Restored Swarm Volume content: $CONTENT"
          test "$CONTENT" = "swarm-s3-ok"
          echo "End-to-end Swarm + S3 (VersityGW) CI test PASSED!"
