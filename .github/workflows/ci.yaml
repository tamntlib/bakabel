name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GO_IMAGE: golang:1.26.8-bookworm@sha256:dc9ad6c05acc7a88e5b71bde60a5fe3bd4b9f0db209011711b464107438a8107
      RESTIC_IMAGE: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
      MODULE_CACHE: bakabel-ci-mod-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_CACHE: bakabel-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned tools and module cache
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RESTIC_IMAGE"
          extractor=$(docker create "$RESTIC_IMAGE" version)
          trap 'docker rm "$extractor" >/dev/null' EXIT
          docker cp "$extractor:/usr/bin/restic" "$RUNNER_TEMP/restic"
          docker volume create "$MODULE_CACHE"
          docker volume create "$BUILD_CACHE"
          docker run --rm \
            -e GOTOOLCHAIN=local \
            -v "$PWD:/work" -w /work -v "$MODULE_CACHE:/go/pkg/mod" \
            "$GO_IMAGE" sh -c 'go mod download && go mod verify'
      - name: Fixture transport, documentation and release guard tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/integration/fixtures -p 'test_*.py' -v
          python3 -m unittest discover \
            -s tests -p test_documentation.py -v
          python3 -B -m unittest discover \
            -s tests -p test_release.py -v
      - name: Race tests and vet
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-add DAC_READ_SEARCH \
            -e GOTOOLCHAIN=local -e GOAMD64=v1 \
            -e RESTIC_TEST_BINARY=/usr/bin/restic -e BAKABEL_FILES_RESTIC=/usr/bin/restic \
            -v "$RUNNER_TEMP/restic:/usr/bin/restic:ro" \
            -v "$PWD:/work" -w /work \
            -v "$MODULE_CACHE:/go/pkg/mod" -v "$BUILD_CACHE:/root/.cache/go-build" \
            "$GO_IMAGE" sh -c 'umask 0077; go test -race -count=1 -v ./... && go vet ./...'
      - name: Build and smoke-test minimal image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t bakabel:ci .
          docker run --rm --network none \
            --entrypoint /usr/bin/restic bakabel:ci version
      - name: Remove only this job's caches
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for volume in "$MODULE_CACHE" "$BUILD_CACHE"; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              docker volume rm "$volume"
            fi
          done
